{% extends "News/base.html" %}
{% block title %}

{% block content %}
    <h2>{{ title }}</h2>

    <section>
        <h3>О нас</h3>

        <ul>
            {% for article in articles %}

            {% endfor %}
        </ul>
    </section>
{% endblock %}
